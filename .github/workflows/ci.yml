name: CI

on:
  push:
    braiches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    run-on: ubuntu-latest
    
    steps:
      - name: Lấy code
      - users: actions/checkout@v4

      - name: Cài .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore package
        run: dotnet restore DevAcademy.slnx

      - name: Build
        run: dotnet build DevAcademy.slnx --no-restore -c Release

      - name: Test
        run: dotnet test DevAcademy.slnx --no-build -c Release